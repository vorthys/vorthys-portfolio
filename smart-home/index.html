      const CardHeader = ({ className, ...props }) => <div className={cn("flex flex-col space-y-1.5 p-6", className)} {...props} />;

      const CardContent = ({ className, ...props }) => <div className={cn("p-6 pt-0", className)} {...props} />;

      /* ---------------- orbital scene ---------------- */

      const STATUS_STYLE = {
        active: { dot: "#34d399", badge: "border-emerald-400/40 bg-emerald-400/15 text-emerald-200", icon: Activity },
        idle: { dot: "#94a3b8", badge: "border-slate-400/30 bg-slate-400/10 text-slate-200", icon: Power },
        alert: { dot: "#fbbf24", badge: "border-amber-400/40 bg-amber-400/15 text-amber-200", icon: AlertTriangle },
        offline: { dot: "#f87171", badge: "border-rose-400/40 bg-rose-400/15 text-rose-200", icon: WifiOff },
      };

      function getRadius(width) {
        if (width < 420) return 112;
        if (width < 640) return 140;
        if (width < 1024) return 172;
        return 208;
      }

      function SmartHomeOrbital({ nodes, t, className }) {
        const [expandedItems, setExpandedItems] = useState({});
        const [rotationAngle, setRotationAngle] = useState(0);
        const [autoRotate, setAutoRotate] = useState(true);
        const [pulseEffect, setPulseEffect] = useState({});
        const [activeNodeId, setActiveNodeId] = useState(null);
        const [size, setSize] = useState({ width: 0, height: 0 });

        const containerRef = useRef(null);
        const orbitRef = useRef(null);
        const nodeRefs = useRef({});
        const radius = getRadius(size.width || 1024);

        useEffect(() => {
          const el = orbitRef.current;
          if (!el) return;
          const update = () => setSize({ width: el.clientWidth, height: el.clientHeight });
          update();
          // ResizeObserver is the primary signal; the window listener is a fallback
          // for cases where the observer is throttled (background or hidden tabs)
          const observer = new ResizeObserver(update);
          observer.observe(el);
          window.addEventListener("resize", update);
          return () => {
            observer.disconnect();
            window.removeEventListener("resize", update);
          };
        }, []);

        useEffect(() => {
          if (!autoRotate) return;
          const timer = setInterval(() => {
            setRotationAngle((prev) => Number(((prev + 0.25) % 360).toFixed(3)));
          }, 50);
          return () => clearInterval(timer);
        }, [autoRotate]);

        // switching language rebuilds the node list — close any open card
        useEffect(() => {
          setExpandedItems({});
          setActiveNodeId(null);
          setPulseEffect({});
        }, [nodes]);

        const getRelatedItems = useCallback(
          (itemId) => (nodes.find((item) => item.id === itemId) || {}).relatedIds || [],
          [nodes]
        );

        const centerViewOnNode = useCallback(
          (nodeId) => {
            const nodeIndex = nodes.findIndex((item) => item.id === nodeId);
            if (nodeIndex < 0) return;
            const targetAngle = (nodeIndex / nodes.length) * 360;
            setRotationAngle((((270 - targetAngle) % 360) + 360) % 360);
          },
          [nodes]
        );

        const resetView = useCallback(() => {
          setExpandedItems({});
          setActiveNodeId(null);
          setPulseEffect({});
          setAutoRotate(true);
        }, []);

        const toggleItem = useCallback(
          (id) => {
            const isOpening = !expandedItems[id];
            setExpandedItems(isOpening ? { [id]: true } : {});
            if (isOpening) {
              setActiveNodeId(id);
              setAutoRotate(false);
              const newPulse = {};
              getRelatedItems(id).forEach((relId) => { newPulse[relId] = true; });
              setPulseEffect(newPulse);
              centerViewOnNode(id);
            } else {
              setActiveNodeId(null);
              setAutoRotate(true);
              setPulseEffect({});
            }
          },
          [centerViewOnNode, expandedItems, getRelatedItems]
        );

        const handleContainerClick = (e) => {
          if (e.target === containerRef.current || e.target === orbitRef.current) resetView();
        };

        const calculateNodePosition = useCallback(
          (index, total) => {
            const angle = ((index / total) * 360 + rotationAngle) % 360;
            const radian = (angle * Math.PI) / 180;
            return {
              x: radius * Math.cos(radian),
              y: radius * Math.sin(radian),
              zIndex: Math.round(100 + 50 * Math.cos(radian)),
              opacity: Math.max(0.45, Math.min(1, 0.45 + 0.55 * ((1 + Math.sin(radian)) / 2))),
            };
          },
          [radius, rotationAngle]
        );

        const positions = useMemo(
          () => nodes.map((_, index) => calculateNodePosition(index, nodes.length)),
          [calculateNodePosition, nodes]
        );

        const isRelatedToActive = (itemId) =>
          activeNodeId !== null && getRelatedItems(activeNodeId).includes(itemId);

        const links = useMemo(() => {
          if (activeNodeId === null) return [];
          const activeIndex = nodes.findIndex((item) => item.id === activeNodeId);
          if (activeIndex < 0) return [];
          const from = positions[activeIndex];
          return getRelatedItems(activeNodeId)
            .map((relId) => {
              const relIndex = nodes.findIndex((item) => item.id === relId);
              if (relIndex < 0) return null;
              return { id: relId, from, to: positions[relIndex] };
            })
            .filter(Boolean);
        }, [activeNodeId, getRelatedItems, nodes, positions]);

        const summary = useMemo(() => ({
          devices: nodes.reduce((acc, node) => acc + (node.devices || 0), 0),
          active: nodes.filter((n) => n.status === "active").length,
          alerts: nodes.filter((n) => n.status === "alert").length,
          offline: nodes.filter((n) => n.status === "offline").length,
        }), [nodes]);

        const activeNode = nodes.find((n) => n.id === activeNodeId) || null;

        return (
          <div
            ref={containerRef}
            onClick={handleContainerClick}
            className={cn("smart-home-scene relative flex w-full flex-col items-center justify-center overflow-hidden", className)}
          >
            <div className="smart-home-grid pointer-events-none absolute inset-0" />

            <div className="pointer-events-none absolute left-0 right-0 top-0 z-[300] flex flex-col gap-1 p-5 sm:p-8">
              <div className="flex items-center gap-2 text-white/90">
                <span className="relative flex h-2 w-2">
                  <span className="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75" />
                  <span className="relative inline-flex h-2 w-2 rounded-full bg-emerald-400" />
                </span>
                <h2 className="text-sm font-semibold uppercase tracking-[0.25em]">{t.hubTitle}</h2>
              </div>
              <p className="text-xs text-white/45">
                {summary.devices} {t.devices} · {summary.active} {t.subsystemsActive}
                {summary.alerts > 0 ? ` · ${summary.alerts} ${t.needsAttention}` : ""}
              </p>
            </div>

            <div className="relative flex h-full w-full max-w-5xl items-center justify-center">
              <div ref={orbitRef} className="absolute flex h-full w-full items-center justify-center" style={{ perspective: "1200px" }}>
                {size.width > 0 && links.length > 0 && (
                  <svg
                    className="pointer-events-none absolute inset-0 h-full w-full"
                    viewBox={`${-size.width / 2} ${-size.height / 2} ${size.width} ${size.height}`}
                    style={{ zIndex: 90 }}
                  >
                    {links.map((link) => (
                      <line key={link.id} x1={link.from.x} y1={link.from.y} x2={link.to.x} y2={link.to.y}
                        stroke="rgba(255,255,255,0.35)" strokeWidth={1} strokeDasharray="4 8" className="animate-link-flow" />
                    ))}
                  </svg>
                )}

                <div className="absolute rounded-full border border-white/10" style={{ width: radius * 2, height: radius * 2 }} />
                <div className="absolute rounded-full border border-dashed border-white/[0.06]" style={{ width: radius * 2 + 56, height: radius * 2 + 56 }} />

                <div className="absolute z-10 flex h-20 w-20 items-center justify-center">
                  <div className="absolute h-24 w-24 animate-ping rounded-full border border-white/15 opacity-60" />
                  <div className="absolute h-28 w-28 animate-ping rounded-full border border-white/10 opacity-40" style={{ animationDelay: "0.6s" }} />
                  <div className="absolute h-16 w-16 animate-hub-breathe rounded-full bg-gradient-to-br from-sky-400 via-indigo-500 to-emerald-400 opacity-90 blur-[2px]" />
                  <div className="relative flex h-12 w-12 items-center justify-center rounded-full bg-slate-950/80 text-white ring-1 ring-white/25 backdrop-blur-md">
                    <Cpu size={18} />
                  </div>
                  <div className="absolute -bottom-8 whitespace-nowrap text-[10px] uppercase tracking-[0.2em] text-white/40">{t.hubSub}</div>
                </div>

                {nodes.map((item, index) => {
                  const position = positions[index];
                  const isExpanded = Boolean(expandedItems[item.id]);
                  const isRelated = isRelatedToActive(item.id);
                  const isPulsing = Boolean(pulseEffect[item.id]);
                  const isDimmed = activeNodeId !== null && !isExpanded && !isRelated;
                  const Icon = item.icon;
                  const status = STATUS_STYLE[item.status];
                  const StatusIcon = status.icon;
                  const statusLabel = t.statuses[item.status];
                  const glowSize = item.load * 0.5 + 46;

                  return (
                    <div
                      key={item.id}
                      ref={(el) => { nodeRefs.current[item.id] = el; }}
                      role="button"
                      tabIndex={0}
                      aria-expanded={isExpanded}
                      aria-label={`${item.title}: ${statusLabel.toLowerCase()}`}
                      className="absolute cursor-pointer transition-all duration-700 focus:outline-none"
                      style={{
                        transform: `translate(${position.x}px, ${position.y}px)`,
                        zIndex: isExpanded ? 250 : position.zIndex,
                        opacity: isExpanded ? 1 : isDimmed ? 0.3 : position.opacity,
                      }}
                      onClick={(e) => { e.stopPropagation(); toggleItem(item.id); }}
                      onKeyDown={(e) => {
                        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); toggleItem(item.id); }
                      }}
                    >
                      <div
                        className={cn("pointer-events-none absolute rounded-full", isPulsing && "animate-pulse")}
                        style={{
                          background: `radial-gradient(circle, ${item.accent.from}40 0%, ${item.accent.to}00 70%)`,
                          width: glowSize, height: glowSize,
                          left: -(glowSize - 44) / 2, top: -(glowSize - 44) / 2,
                        }}
                      />

                      <div
                        className={cn(
                          "relative flex h-11 w-11 items-center justify-center rounded-2xl border transition-all duration-300",
                          isExpanded ? "scale-125 border-white/70 text-slate-950"
                            : isRelated ? "border-white/60 text-white" : "border-white/20 text-white/80"
                        )}
                        style={{
                          background: isExpanded ? `linear-gradient(135deg, ${item.accent.from}, ${item.accent.to})` : "rgba(8, 12, 20, 0.85)",
                          boxShadow: isExpanded ? `0 0 28px ${item.accent.from}66` : isRelated ? `0 0 16px ${item.accent.from}55` : "none",
                        }}
                      >
                        <Icon size={18} />
                        <span className="absolute -right-0.5 -top-0.5 h-2.5 w-2.5 rounded-full ring-2 ring-slate-950" style={{ background: status.dot }} />
                      </div>

                      <div className={cn(
                        "absolute left-1/2 top-14 -translate-x-1/2 whitespace-nowrap text-[11px] font-medium tracking-wide transition-all duration-300",
                        isExpanded ? "scale-110 text-white" : "text-white/60"
                      )}>
                        {item.title}
                      </div>

                      {isExpanded && (
                        <Card
                          onClick={(e) => e.stopPropagation()}
                          className="absolute left-1/2 top-24 w-72 max-w-[calc(100vw-2rem)] -translate-x-1/2 overflow-visible border-white/15 bg-slate-950/90 text-white shadow-2xl backdrop-blur-xl max-sm:fixed max-sm:inset-x-4 max-sm:bottom-6 max-sm:left-auto max-sm:top-auto max-sm:w-auto max-sm:max-w-none max-sm:translate-x-0"
                        >
                          <div className="absolute -top-3 left-1/2 h-3 w-px -translate-x-1/2 bg-white/30 max-sm:hidden" />
                          <div className="absolute inset-x-0 -top-px h-px" style={{ background: `linear-gradient(90deg, transparent, ${item.accent.from}, transparent)` }} />
                          <CardHeader className="space-y-2 p-4 pb-2">
                            <div className="flex items-center justify-between gap-2">
                              <Badge className={cn("gap-1 px-2 py-0 text-[10px] tracking-wider", status.badge)}>
                                <StatusIcon size={10} />
                                {statusLabel}
                              </Badge>
                              <span className="text-[10px] uppercase tracking-wider text-white/40">{item.zone}</span>
                            </div>
                            <CardTitle className="text-base font-semibold">{item.title}</CardTitle>
                          </CardHeader>

                          <CardContent className="p-4 pt-0 text-xs text-white/70">
                            <p className="leading-relaxed">{item.content}</p>

                            {item.metrics && item.metrics.length > 0 && (
                              <div className="mt-3 grid grid-cols-2 gap-2">
                                {item.metrics.map((metric) => {
                                  const MetricIcon = metric.icon;
                                  return (
                                    <div key={metric.label} className="rounded-lg border border-white/10 bg-white/[0.03] px-2.5 py-2">
                                      <div className="flex items-center gap-1 text-[10px] uppercase tracking-wider text-white/40">
                                        {MetricIcon && <MetricIcon size={10} />}
                                        {metric.label}
                                      </div>
                                      <div className="mt-0.5 font-mono text-sm text-white">{metric.value}</div>
                                    </div>
                                  );
                                })}
                              </div>
                            )}

                            <div className="mt-4 border-t border-white/10 pt-3">
                              <div className="mb-1 flex items-center justify-between text-[11px]">
                                <span className="text-white/50">{item.loadLabel || t.load}</span>
                                <span className="font-mono text-white">{item.load}%</span>
                              </div>
                              <div className="h-1.5 w-full overflow-hidden rounded-full bg-white/10">
                                <div className="h-full rounded-full transition-all duration-700"
                                  style={{ width: `${item.load}%`, background: `linear-gradient(90deg, ${item.accent.from}, ${item.accent.to})` }} />
                              </div>
                            </div>

                            {item.relatedIds.length > 0 && (
                              <div className="mt-4 border-t border-white/10 pt-3">
                                <div className="mb-2 flex items-center gap-1 text-[10px] uppercase tracking-wider text-white/40">
                                  <Link2 size={10} />
                                  {t.linked}
                                </div>
                                <div className="flex flex-wrap gap-1.5">
                                  {item.relatedIds.map((relatedId) => {
                                    const relatedItem = nodes.find((i) => i.id === relatedId);
                                    if (!relatedItem) return null;
                                    return (
                                      <Button key={relatedId}
                                        className="h-7 gap-1 rounded-full border-white/15 bg-white/[0.03] px-2.5 text-[11px] text-white/75 hover:bg-white/10 hover:text-white"
                                        onClick={(e) => { e.stopPropagation(); toggleItem(relatedId); }}>
                                        {relatedItem.title}
                                        <ArrowRight size={10} />
                                      </Button>
                                    );
                                  })}
                                </div>
                              </div>
                            )}
                          </CardContent>
                        </Card>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="absolute bottom-0 left-0 right-0 z-[300] flex flex-wrap items-center justify-between gap-3 p-5 sm:p-8">
              <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-white/45">
                <span className="flex items-center gap-1.5"><span className="h-1.5 w-1.5 rounded-full bg-emerald-400" />{t.active} {summary.active}</span>
                <span className="flex items-center gap-1.5"><span className="h-1.5 w-1.5 rounded-full bg-amber-400" />{t.attention} {summary.alerts}</span>
                <span className="flex items-center gap-1.5"><span className="h-1.5 w-1.5 rounded-full bg-rose-400" />{t.offline} {summary.offline}</span>
                {activeNode && <span className="text-white/70">{t.selected}: {activeNode.title}</span>}
              </div>

              <Button
                className="h-8 gap-1.5 rounded-full border-white/15 bg-white/[0.04] px-3 text-[11px] text-white/70 hover:bg-white/10 hover:text-white"
                onClick={(e) => { e.stopPropagation(); setAutoRotate((prev) => !prev); }}
              >
                {autoRotate ? <Pause size={12} /> : <Play size={12} />}
                {autoRotate ? t.pause : t.rotate}
              </Button>
            </div>
          </div>
        );
      }

      /* ---------------- page around the demo ---------------- */

      function SiteBar({ lang, setLang, t }) {
        return (
          <header className="sticky top-0 z-[400] border-b border-white/10 bg-[#05070c]/90 backdrop-blur">
            <div className="mx-auto flex w-[min(1180px,100%-2rem)] items-center gap-4 py-3">
              <a href="/" className="flex items-center gap-2 text-[15px] font-semibold tracking-tight text-white">
                <svg viewBox="0 0 64 64" className="h-5 w-5" aria-hidden="true">
                  <path d="M6 8h16l10 30 10-30h16L38 58H26L6 8z" fill="#f4f3ef" />
                  <path d="M42 8h16L38 58h-8l12-50z" fill="#f2c230" />
                </svg>
                Vorthys
              </a>
              <a href={lang === "cs" ? "/cs/#prace" : "/#work"} className="ml-auto text-[13px] text-white/50 transition-colors hover:text-white">
                ← {t.back}
              </a>
              <div className="flex gap-0.5 font-mono text-[11px]">
                <button onClick={() => setLang("en")}
                  className={cn("rounded px-2 py-1 tracking-wider transition-colors", lang === "en" ? "bg-white text-slate-950" : "text-white/50 hover:text-white")}>EN</button>
                <button onClick={() => setLang("cs")}
                  className={cn("rounded px-2 py-1 tracking-wider transition-colors", lang === "cs" ? "bg-white text-slate-950" : "text-white/50 hover:text-white")}>CS</button>
              </div>
            </div>
          </header>
        );
      }

      function About({ lang, t }) {
        const workHref = lang === "cs" ? "/cs/#prace" : "/#work";
        return (
          <section className="border-t border-white/10 bg-[#05070c] py-14 text-white sm:py-20">
            <div className="mx-auto grid w-[min(1180px,100%-3rem)] gap-10 lg:grid-cols-[1.05fr_.95fr]">
              <div>
                <p className="font-mono text-[11px] uppercase tracking-[0.2em] text-amber-300">{t.caseKicker}</p>
                <h1 className="mt-4 text-3xl font-semibold leading-tight tracking-tight sm:text-4xl">{t.caseTitle}</h1>
                <p className="mt-4 max-w-[52ch] text-white/60">{t.caseLead}</p>
                <p className="mt-5 max-w-[52ch] text-white/60">{t.aboutBody}</p>

                <p className="mt-8 font-mono text-[11px] uppercase tracking-[0.18em] text-white/40">{t.builtWith}</p>
                <div className="mt-3 flex flex-wrap gap-2">
                  {["React 18", "Tailwind CSS", "shadcn/ui", "lucide-react", "SVG"].map((tech) => (
                    <span key={tech} className="rounded-full border border-white/15 px-3 py-1 text-[12px] text-white/70">{tech}</span>
                  ))}
                </div>

                <div className="mt-9 flex flex-wrap gap-3">
                  <a href={workHref} className="rounded-full bg-amber-300 px-5 py-2.5 text-[14px] font-medium text-slate-950 transition-transform hover:-translate-y-0.5">
                    {t.otherWork}
                  </a>
                  <a href="mailto:info@vorthys.eu?subject=Project%20enquiry"
                    className="rounded-full px-5 py-2.5 text-[14px] font-medium text-white ring-1 ring-white/25 transition-colors hover:bg-white/10">
                    info@vorthys.eu
                  </a>
                </div>
              </div>

              <div className="grid gap-3 self-start">
                {t.notes.map(([title, body]) => (
                  <div key={title} className="rounded-2xl border border-white/10 bg-white/[0.03] p-5">
                    <h2 className="text-[15px] font-semibold">{title}</h2>
                    <p className="mt-1.5 text-[13.5px] leading-relaxed text-white/55">{body}</p>
                  </div>
                ))}
                <p className="mt-2 font-mono text-[10px] uppercase tracking-[0.14em] text-white/30">{t.demoNote}</p>
              </div>
            </div>
          </section>
        );
      }

      function App() {
        const [lang, setLang] = useState("en");
        const t = I18N[lang];

        useEffect(() => {
          document.documentElement.lang = t.htmlLang;
          document.title = `${t.caseTitle} — Vorthys`;
        }, [t]);

        return (
          <>
            <SiteBar lang={lang} setLang={setLang} t={t} />
            <SmartHomeOrbital nodes={NODES[lang]} t={t} className="h-[calc(100vh-53px)] min-h-[620px]" />
            <About lang={lang} t={t} />
          </>
        );
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
